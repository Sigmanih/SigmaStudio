[package]
name = "sigma-network"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Server HTTP Axum, SSE streaming e compatibilità OpenAI per SigmaEngine"

[dependencies]
sigma-core = { path = "../sigma-core" }
sigma-memory = { path = "../sigma-memory" }
sigma-model = { path = "../sigma-model" }
sigma-scheduler = { path = "../sigma-scheduler" }
sigma-tools = { path = "../sigma-tools" }
sigma-agent = { path = "../sigma-agent" }
sigma-bench = { path = "../sigma-bench" }

tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
