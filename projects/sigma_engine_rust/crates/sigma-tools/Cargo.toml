[package]
name = "sigma-tools"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Tool Execution Graph ultraveloce e Tool Registry nativo per SigmaEngine"

[dependencies]
sigma-core = { path = "../sigma-core" }
sigma-memory = { path = "../sigma-memory" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
