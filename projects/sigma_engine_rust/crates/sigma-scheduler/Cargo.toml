[package]
name = "sigma-scheduler"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Scheduler asincrono concorrente, TaskGraph e Continuous Batching per SigmaEngine"

[dependencies]
sigma-core = { path = "../sigma-core" }
sigma-model = { path = "../sigma-model" }
tokio = { version = "1.38", features = ["full"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
async-trait = "0.1"
