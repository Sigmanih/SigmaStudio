[package]
name = "sigma-memory"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Allocatore di memoria zero-copy mmap, Paged KV Cache e BufferPool per SigmaEngine"

[dependencies]
sigma-core = { path = "../sigma-core" }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
parking_lot = "0.12"
