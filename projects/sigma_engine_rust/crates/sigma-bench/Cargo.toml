[package]
name = "sigma-bench"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Suite di benchmarking e profilazione prestazionale per SigmaEngine (TTFT, Decode, E2E)"

[dependencies]
sigma-core = { path = "../sigma-core" }
sigma-memory = { path = "../sigma-memory" }
sigma-model = { path = "../sigma-model" }
sigma-tools = { path = "../sigma-tools" }
sigma-agent = { path = "../sigma-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
