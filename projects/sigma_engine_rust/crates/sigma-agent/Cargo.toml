[package]
name = "sigma-agent"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Pipeline agentica deterministica (Read -> Taskify -> Execute -> Verify) per SigmaEngine"

[dependencies]
sigma-core = { path = "../sigma-core" }
sigma-tools = { path = "../sigma-tools" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
