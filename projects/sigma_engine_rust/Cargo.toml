[workspace]
members = [
    ".",
    "crates/sigma-core",
    "crates/sigma-memory",
    "crates/sigma-model",
    "crates/sigma-scheduler",
    "crates/sigma-tools",
    "crates/sigma-agent",
    "crates/sigma-bench",
    "crates/sigma-network",
]
resolver = "2"

[package]
name = "sigma_engine_rust"
version = "0.1.0"
edition = "2021"
authors = ["Sigma Studio Team <dev@sigmastudio.local>"]
description = "Micro-Kernel Computazionale in Rust per SigmaStudio"

[dependencies]
sigma-core = { path = "crates/sigma-core" }
sigma-memory = { path = "crates/sigma-memory" }
sigma-model = { path = "crates/sigma-model" }
sigma-scheduler = { path = "crates/sigma-scheduler" }
sigma-tools = { path = "crates/sigma-tools" }
sigma-agent = { path = "crates/sigma-agent" }
sigma-bench = { path = "crates/sigma-bench" }
sigma-network = { path = "crates/sigma-network" }

tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
