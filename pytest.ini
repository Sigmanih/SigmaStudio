[pytest]
testpaths = tests
python_files = test_*.py *_test.py
norecursedirs = scratch .venv .git node_modules unsloth_compiled_cache .backups data

# La corsa predefinita non avvia modelli veri. I lotti stanno in tests/lotti.py
# e si chiedono per nome (`pytest -m harness`, `-m mcp`, ...); chi vuole anche le
# prove pesanti aggiunge `pytest -m lento`.
addopts = -m "not lento"
