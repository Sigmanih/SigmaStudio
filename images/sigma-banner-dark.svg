<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#080C17" />
    </linearGradient>

    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="btn-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="btn-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>

    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="360" rx="18" fill="url(#hero-bg-dark)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="360" rx="18" fill="url(#dot-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38BDF8" fill-opacity="0.10" filter="url(#blur-glow)" />
  <circle cx="1000" cy="120" r="160" fill="#818CF8" fill-opacity="0.10" filter="url(#blur-glow)" />
  <circle cx="600" cy="300" r="180" fill="#C084FC" fill-opacity="0.08" filter="url(#blur-glow)" />

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1200" height="3" rx="1.5" fill="url(#title-glow)" />

  <!-- Top Category Track -->
  <g transform="translate(0, 48)">
    <text x="600" y="0" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="4">LOCAL AI  •  AUTONOMOUS AGENTS  •  NATIVE INFERENCE  •  MCP TOOLS</text>
  </g>

  <!-- Center Logo + Brand Title -->
  <g transform="translate(600, 115)">
    <!-- Main Big Title -->
    <text x="0" y="0" text-anchor="middle" fill="url(#title-glow)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Σ-SIGMA STUDIO</text>
    
    <!-- Core Tagline -->
    <text x="0" y="42" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2">A modular AI workspace for running, building and orchestrating AI locally and across hardware.</text>
    
    <!-- Sub-Motto -->
    <text x="0" y="74" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" letter-spacing="2.5">Study  •  Build  •  Experiment  •  Share</text>
  </g>

  <!-- Action Badges Row (Centered) -->
  <g transform="translate(600, 245)">
    <!-- Get Started Pill -->
    <g transform="translate(-255, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">🚀 Get Started</text>
    </g>

    <!-- Watch Demo Pill -->
    <g transform="translate(-85, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#7C3AED" fill-opacity="0.25" stroke="#A855F7" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">🎥 Watch Demo</text>
    </g>

    <!-- Star On GitHub Pill -->
    <g transform="translate(85, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#10B981" fill-opacity="0.25" stroke="#34D399" stroke-width="1.2" />
      <text x="75" y="23" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">⭐ Star on GitHub</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Line -->
  <g transform="translate(600, 325)">
    <text x="0" y="0" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">Python  ·  C++  ·  PyTorch  ·  CUDA  ·  React 19  ·  FastAPI  ·  MCP</text>
  </g>
</svg>
