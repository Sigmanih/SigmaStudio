<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="title-glow-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <pattern id="dot-grid-light" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="360" rx="18" fill="url(#hero-bg-light)" stroke="#CBD5E1" stroke-width="1.5" />
  <rect width="1200" height="360" rx="18" fill="url(#dot-grid-light)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#title-glow-light)" />

  <!-- Top Category Track -->
  <g transform="translate(0, 48)">
    <text x="600" y="0" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="4">LOCAL AI  •  AUTONOMOUS AGENTS  •  NATIVE INFERENCE  •  MCP TOOLS</text>
  </g>

  <!-- Center Logo + Brand Title -->
  <g transform="translate(600, 115)">
    <!-- Main Big Title -->
    <text x="0" y="0" text-anchor="middle" fill="url(#title-glow-light)" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">Σ-SIGMA STUDIO</text>
    
    <!-- Core Tagline -->
    <text x="0" y="42" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.2">A modular AI workspace for running, building and orchestrating AI locally and across hardware.</text>
    
    <!-- Sub-Motto -->
    <text x="0" y="74" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5">Study  •  Build  •  Experiment  •  Share</text>
  </g>

  <!-- Action Badges Row (Centered) -->
  <g transform="translate(600, 245)">
    <!-- Get Started Pill -->
    <g transform="translate(-255, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.3" />
      <text x="75" y="23" text-anchor="middle" fill="#0369A1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">🚀 Get Started</text>
    </g>

    <!-- Watch Demo Pill -->
    <g transform="translate(-85, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.3" />
      <text x="75" y="23" text-anchor="middle" fill="#7E22CE" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">🎥 Watch Demo</text>
    </g>

    <!-- Star On GitHub Pill -->
    <g transform="translate(85, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="1.3" />
      <text x="75" y="23" text-anchor="middle" fill="#047857" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">⭐ Star on GitHub</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Line -->
  <g transform="translate(600, 325)">
    <text x="0" y="0" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">Python  ·  C++  ·  PyTorch  ·  CUDA  ·  React 19  ·  FastAPI  ·  MCP</text>
  </g>
</svg>
